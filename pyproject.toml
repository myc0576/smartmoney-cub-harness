[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartmoney-cub"
version = "0.1.0"
description = "SmartMoney-Cub: a local-first, read-only AI trading review system for decision logging, evidence capture, outcome review, and human-approved rule evolution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "smartmoney-cub contributors" }]
keywords = [
  "trading-review",
  "decision-review",
  "trading-journal",
  "subjective-trading",
  "semi-quant",
  "rule-evolution",
  "human-in-the-loop",
  "local-first",
  "read-only",
  "decision-log",
  "evidence",
  "agent-loop",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/myc0576/SmartMoney-Cub"
Repository = "https://github.com/myc0576/SmartMoney-Cub"
Issues = "https://github.com/myc0576/SmartMoney-Cub/issues"
Changelog = "https://github.com/myc0576/SmartMoney-Cub/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
smcub = "smartmoney_cub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:dash"

