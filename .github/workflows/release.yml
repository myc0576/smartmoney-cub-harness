name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Verify tag matches package version
        env:
          PYTHONPATH: src
        run: >-
          python -c "import os; from smartmoney_cub_harness import __version__;
          expected = f'v{__version__}'; actual = os.environ['GITHUB_REF_NAME'];
          assert actual == expected, f'tag {actual!r} does not match {expected!r}'"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify built wheel installs
        run: |
          python -m pip install dist/*.whl
          smcub --version
          smcub doctor

      - name: Verify installed toy loop outside checkout
        run: |
          run_root="$(mktemp -d)"
          cd "${run_root}"
          smcub loop --preset toy --agent-trigger loop --json > loop-summary.json
          run_dir="$(python -c "import json; print(json.load(open('loop-summary.json'))['run_dir'])")"
          smcub inspect-artifacts "${run_dir}" > artifact-inspection.json
          python -c "import json; result=json.load(open('artifact-inspection.json')); assert result['status'] == 'ok', result"
          python -c "from pathlib import Path; text='\n'.join(p.read_text(encoding='utf-8', errors='replace') for p in Path('.').rglob('*') if p.is_file()); forbidden=('/home/', '/usr/', '/opt/', '/tmp/'); assert not any(item in text for item in forbidden), forbidden"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Create release and attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
